function initQuiz(){qCur=0;qScore=0;qAnswered=false;document.getElementById('quiz-body').style.display='block';document.getElementById('quiz-result').style.display='none';renderQuestion();}
function renderQuestion(){if(qCur>=questions.length){showResult();return;}const q=questions[qCur];document.getElementById('q-num').textContent='Question '+(qCur+1)+' of '+questions.length+' · '+q.topic;document.getElementById('q-text').textContent=q.q;const cont=document.getElementById('q-options');cont.innerHTML='';q.opts.forEach((opt,i)=>{const b=document.createElement('button');b.className='option-btn';b.textContent=String.fromCharCode(65+i)+'. '+opt;b.addEventListener('click',()=>pickAnswer(i,b,q));cont.appendChild(b);});document.getElementById('q-exp').style.display='none';document.getElementById('q-exp').textContent='';qAnswered=false;document.getElementById('btn-next').disabled=true;updateProgress();}
function pickAnswer(i,btn,q){if(qAnswered)return;const btns=document.querySelectorAll('#q-options .option-btn');qAnswered=true;btns.forEach(b=>b.disabled=true);if(i===q.ans){btn.classList.add('correct');qScore++;}else{btn.classList.add('wrong');btns[q.ans].classList.add('reveal');}const exp=document.getElementById('q-exp');exp.textContent=q.exp;exp.style.display='block';document.getElementById('btn-next').disabled=false;document.getElementById('score-display').textContent=qScore+'/'+(qCur+1);}

function showResult(){document.getElementById('quiz-body').style.display='none';const res=document.getElementById('quiz-result');res.style.display='block';const pct=Math.round(qScore/questions.length*100);document.getElementById('res-num').textContent=qScore;document.getElementById('res-den').textContent=questions.length;let msg='',cls='';if(pct>=90){msg='Outstanding! Exam-ready.';cls='background:var(--green-light);color:var(--green)';}else if(pct>=75){msg='Very good – almost there!';cls='background:var(--blue-light);color:var(--blue)';}else if(pct>=60){msg='Good progress – keep studying.';cls='background:var(--gold-light);color:var(--gold-dark)';}else{msg='Needs more revision.';cls='background:var(--red-light);color:var(--red)';}document.getElementById('res-msg').textContent=msg;document.getElementById('res-grade').style.cssText=cls;document.getElementById('res-grade').textContent=pct+'%';}
